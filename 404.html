<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages Single Page App Redirect
    // Redirects /path to /#/path
    (function () {
      var path = window.location.pathname;
      var repo = path.split('/')[1];
      // If deployed at username.github.io/<repo>/
      var query = window.location.search;
      var hash = window.location.hash;
      window.location.replace(window.location.origin + '/#' + path + query + hash);
    })();
  </script>
</head>
<body>
</body>
</html>
